<!-- Critical font-loading CSS to prevent FOUT -->
<style>
    /* Hide text until fonts are ready */
    .fonts-loading {
        visibility: hidden;
    }
    .fonts-loaded,
    .fonts-failed {
        visibility: visible;
    }
</style>
<script>
    // Add fonts-loading class immediately
    document.documentElement.classList.add('fonts-loading');

    // Use Font Loading API to detect when fonts are ready
    if ('fonts' in document) {
        Promise.all([
            document.fonts.load('400 1em Inter'),
            document.fonts.load('400 1em Tajawal'),
            document.fonts.load('400 1em Majalla')
        ]).then(function() {
            document.documentElement.classList.remove('fonts-loading');
            document.documentElement.classList.add('fonts-loaded');
        }).catch(function() {
            // Fallback: show content even if fonts fail
            document.documentElement.classList.remove('fonts-loading');
            document.documentElement.classList.add('fonts-failed');
        });

        // Safety timeout: show content after 2 seconds max
        setTimeout(function() {
            if (document.documentElement.classList.contains('fonts-loading')) {
                document.documentElement.classList.remove('fonts-loading');
                document.documentElement.classList.add('fonts-loaded');
            }
        }, 2000);
    } else {
        // Browser doesn't support Font Loading API
        document.documentElement.classList.remove('fonts-loading');
        document.documentElement.classList.add('fonts-loaded');
    }
</script>
