    <style>
        /* ===== ENHANCED RESULTS PAGE STYLES ===== */

        /* Animated gradient background for results section */
        .results-hero {
            position: relative;
            overflow: hidden;
        }

        .results-hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.1) 0%, transparent 70%);
            animation: rotateGradient 20s linear infinite;
        }

        @keyframes rotateGradient {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Enhanced trophy icon with pulse and glow */
        .result-icon-enhanced {
            position: relative;
            display: inline-block;
        }

        .result-icon-enhanced i {
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 10px 20px rgba(255, 193, 7, 0.5));
            animation: iconPulse 2s ease-in-out infinite;
        }

        .result-icon-enhanced::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(255, 193, 7, 0.3), transparent);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: glowPulse 2s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
        }

        /* Animated score circle with gradient border */
        .score-circle-wrapper {
            position: relative;
            display: inline-block;
            padding: 3rem;
        }

        .score-circle-border {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #667eea, #764ba2, #667eea);
            background-size: 200% 200%;
            animation: gradientShift 3s ease infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Enhanced score display with shimmer */
        .score-display-enhanced {
            position: relative;
            font-size: 5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #667eea 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* Percentage badge with 3D effect */
        .percentage-badge {
            display: inline-block;
            padding: 1rem 2.5rem;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 50px;
            box-shadow:
                0 10px 25px rgba(102, 126, 234, 0.3),
                inset 0 -3px 10px rgba(0,0,0,0.2),
                inset 0 3px 10px rgba(255,255,255,0.3);
            transform: translateY(0);
            transition: all 0.3s ease;
        }

        .percentage-badge:hover {
            transform: translateY(-5px);
            box-shadow:
                0 15px 35px rgba(102, 126, 234, 0.4),
                inset 0 -3px 10px rgba(0,0,0,0.2),
                inset 0 3px 10px rgba(255,255,255,0.3);
        }

        /* Stars earned with sparkle animation */
        .stars-badge {
            position: relative;
            display: inline-block;
            font-size: 2rem;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #fff;
            border-radius: 30px;
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.4);
            animation: starFloat 3s ease-in-out infinite;
        }

        @keyframes starFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .stars-badge::before {
            content: '✨';
            position: absolute;
            left: -15px;
            top: -10px;
            font-size: 1.5rem;
            animation: sparkle 1.5s ease-in-out infinite;
        }

        .stars-badge::after {
            content: '✨';
            position: absolute;
            right: -15px;
            bottom: -10px;
            font-size: 1.5rem;
            animation: sparkle 1.5s ease-in-out infinite 0.75s;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* Comparison card with glass morphism */
        .comparison-card-fancy {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(102, 126, 234, 0.2);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.1);
            overflow: hidden;
            position: relative;
        }

        .comparison-card-fancy::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s;
        }

        .comparison-card-fancy:hover::before {
            left: 100%;
        }

        /* Stats card with gradient border */
        .stats-card-gradient {
            position: relative;
            border-radius: 20px;
            padding: 2px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .stats-card-inner {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 18px;
            padding: 2rem;
            color: white;
        }

        /* Action buttons with enhanced hover effects */
        .btn-fancy {
            position: relative;
            overflow: hidden;
            border: none;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: normal;
            line-height: 1.3;
        }

        .btn-fancy::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-fancy:hover::before {
            width: 400px;
            height: 400px;
        }

        .btn-fancy:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        /* New record ribbon */
        .new-record-ribbon {
            position: absolute;
            top: 30px;
            right: -35px;
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            padding: 10px 50px;
            transform: rotate(45deg);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
            font-weight: bold;
            font-size: 0.9rem;
            z-index: 10;
            animation: ribbonSlide 0.8s ease-out;
        }

        @keyframes ribbonSlide {
            0% { right: -200px; }
            100% { right: -35px; }
        }

        /* Time badge */
        .time-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 50px;
            font-weight: 600;
            color: #667eea;
        }

        /* Encouragement message with fade-in */
        .encouragement-message {
            animation: fadeInUp 0.8s ease-out 0.5s both;
            padding: 1.5rem;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05), rgba(118, 75, 162, 0.05));
            border-radius: 15px;
            border-left: 4px solid #667eea;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Subject icon with rotating border */
        .subject-icon-fancy {
            position: relative;
            display: inline-block;
            padding: 1rem;
        }

        .subject-icon-fancy::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            animation: rotateBorder 3s linear infinite;
            z-index: -1;
        }

        @keyframes rotateBorder {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .score-display-enhanced {
                font-size: 3.5rem;
            }

            .percentage-badge {
                font-size: 2rem;
                padding: 0.75rem 2rem;
            }

            .stars-badge {
                font-size: 1.5rem;
                padding: 0.75rem 1.5rem;
            }

            .new-record-ribbon {
                font-size: 0.75rem;
                padding: 8px 40px;
            }
        }

/* Hide score elements until JavaScript populates them */
.score-loading {
    opacity: 0;
    transition: opacity 0.3s ease-in-out;
}

.score-loaded {
    opacity: 1;
}

/* Animated View Details Button */
#viewDetailsBtn {
    position: relative;
    overflow: hidden;
background: linear-gradient(135deg, #90EE90, #7FD87F, #90EE90);

    background-size: 200% 200%;
    animation: gradientFlow 3s ease infinite, fadeInBounce 0.8s ease-out 0.6s both, subtlePulse 2s ease-in-out 1.4s infinite;
    box-shadow: 0 5px 20px rgba(23, 162, 184, 0.4);
    border: 2px solid rgba(255, 255, 255, 0.3);
}

#viewDetailsBtn:hover {
    background: linear-gradient(135deg, #138496, #17a2b8, #138496);
    box-shadow: 0 8px 30px rgba(23, 162, 184, 0.6);
    transform: translateY(-5px) scale(1.02);
    animation: gradientFlow 1.5s ease infinite, subtlePulse 1s ease-in-out infinite;
}

#viewDetailsBtn::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    animation: shimmerSlide 3s ease-in-out infinite;
    z-index: 0;
}

#viewDetailsBtn i,
#viewDetailsBtn span {
    position: relative;
    z-index: 1;
}

@keyframes gradientFlow {
    0%, 100% {
        background-position: 0% 50%;
    }
    50% {
        background-position: 100% 50%;
    }
}

@keyframes fadeInBounce {
    0% {
        opacity: 0;
        transform: translateY(30px) scale(0.9);
    }
    60% {
        opacity: 1;
        transform: translateY(-10px) scale(1.05);
    }
    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes subtlePulse {
    0%, 100% {
        box-shadow: 0 5px 20px rgba(23, 162, 184, 0.4);
    }
    50% {
        box-shadow: 0 5px 30px rgba(23, 162, 184, 0.7), 0 0 20px rgba(23, 162, 184, 0.3);
    }
}

@keyframes shimmerSlide {
    0% {
        left: -100%;
    }
    50%, 100% {
        left: 100%;
    }
}

/* Equal height button rows */
.equal-height-row {
    display: flex;
    flex-wrap: wrap;
}

.equal-height-row > [class*='col-'] {
    display: flex;
    flex-direction: column;
}

/* CSS Fraction Styling - Looks like LaTeX but instant! */
.fraction {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    vertical-align: middle;
    font-size: 0.9em;
}

.fraction .numerator {
    border-bottom: 2px solid currentColor;
    padding: 0 0.3em 0.1em;
}

.fraction .denominator {
    padding: 0.1em 0.3em 0;
}

#scoreDisplay .fraction {
    font-size: 3rem;
}

#scoreDisplay .fraction .numerator,
#scoreDisplay .fraction .denominator {
    font-weight: 900;
    color: #667eea;
}

#currentScoreText .fraction,
#previousBestText .fraction,
#totalBestScore .fraction {
    font-size: 1.2rem;
}


#resultTitle {
    color: white;
}

/* ===== PRINT STYLES ===== */
@media print {
    /* Hide everything except the quiz details modal */
    body > *:not(#quizDetailsModal) {
        display: none !important;
    }

    /* Hide unnecessary modal elements */
    .modal-header .btn-close, .modal-footer,
    button:not(.print-only) {
        display: none !important;
    }

    /* Reset modal styling for print */
    .modal {
        position: static !important;
        display: block !important;
        background: white !important;
    }

    .modal-dialog {
        max-width: 100% !important;
        margin: 0 !important;
    }

    .modal-content {
        border: none !important;
        box-shadow: none !important;
    }

    .modal-header {
        background: white !important;
        color: black !important;
        border-bottom: 2px solid #333 !important;
        padding: 15px 0 !important;
    }

    .modal-body {
        padding: 15px 0 !important;
    }

    /* Print-friendly question cards */
    .card {
        page-break-inside: avoid;
        border: 1px solid #333 !important;
        margin-bottom: 15px !important;
        background: white !important;
    }

    /* Ensure colored borders remain visible in print */
    .border-success {
        border-color: #198754 !important;
        border-width: 2px !important;
    }

    .border-danger {
        border-color: #dc3545 !important;
        border-width: 2px !important;
    }

    /* Make text more readable for print */
    .text-success {
        color: #198754 !important;
    }

    .text-danger {
        color: #dc3545 !important;
    }

    .text-warning {
        color: #856404 !important;
    }

    /* Ensure badges are visible */
    .badge {
        border: 1px solid #333;
        color: black !important;
        background: white !important;
    }

    /* Icons for print */
    .bi-check-circle-fill::before {
        content: "✓ ";
    }

    .bi-x-circle-fill::before {
        content: "✗ ";
    }

    /* Images */
    img {
        max-width: 100% !important;
        page-break-inside: avoid;
    }

    /* Summary section */
    .bg-light {
        background: #f8f9fa !important;
        border: 1px solid #dee2e6 !important;
    }

    /* Page breaks */
    h6 {
        page-break-after: avoid;
    }

    /* Font sizes */
    body {
        font-size: 12pt;
    }

    h5 {
        font-size: 18pt;
    }

    h6 {
        font-size: 14pt;
    }
}

                                    <div class="h3 fw-bold mb-0 text-primary score-loading" id="currentScoreText"></div>


                                </div>
                                <div class="col-6">
                                    <div class="text-muted small mb-2 text-uppercase" style="letter-spacing: 0.5px;" data-en="Previous Best" data-ar="أفضل نتيجة سابقة"></div>
                                    <div class="h3 fw-bold mb-0 text-secondary score-loading" id="previousBestText"></div>

                                </div>
                            </div>
                        </div>

                        <!-- Time Taken -->
                        <div class="mb-4">
                            <div class="time-badge">
                                <i class="bi bi-clock-fill"></i>
                                <span data-en="Time Taken:" data-ar="الوقت المستغرق:"></span>
                                <span class="fw-bold" id="timeTaken">0:00</span>
                            </div>
                        </div>

                        <!-- Updated Stats -->
                        <div class="stats-card-gradient mb-4">
                            <div class="stats-card-inner">
                                <h5 class="mb-4 fw-bold" data-en="📊 Updated Statistics" data-ar="📊 إحصائياتك المحدثة"></h5>
                                <div class="row">
                                    <div class="col-6">
                                        <div class="opacity-75 small mb-2 text-uppercase" style="letter-spacing: 0.5px;" data-en="Total Best Score" data-ar="مجموع أفضل النتائج"></div>
                                        <div class="h3 fw-bold mb-0 score-loading" id="totalBestScore"></div>

                                    </div>
                                    <div class="col-6">
                                        <div class="opacity-75 small mb-2 text-uppercase" style="letter-spacing: 0.5px;" data-en="Overall Percentage" data-ar="النسبة المئوية"></div>
                                        <div class="h3 fw-bold mb-0" id="overallPercentage">0%</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="row g-3 equal-height-row">
                    <div class="col-12 col-md-4">
                        <a href="dashboard.html" class="btn btn-fancy w-100 btn-lg" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
                            <i class="bi bi-house-door-fill me-2"></i>
                            <span data-en="Dashboard" data-ar="الرئيسية"></span>
                        </a>
                    </div>
                    <div class="col-12 col-md-4">
                        <button class="btn btn-success btn-fancy w-100 btn-lg" onclick="retryQuiz()">
                            <i class="bi bi-arrow-repeat me-2"></i>
                            <span data-en="Try Again" data-ar="حاول مرة أخرى"></span>
                        </button>
                    </div>
                    <div class="col-12 col-md-4">
                        <a href="leaderboard.html" class="btn btn-warning btn-fancy w-100 btn-lg">
                            <i class="bi bi-trophy-fill me-2"></i>
                            <span data-en="Leaderboard" data-ar="لوحة المتصدرين"></span>
                        </a>
                    </div>
                </div>

                <!-- View Details Button (New Row) -->
                <div class="row g-3 mt-2">
                    <div class="col-12">
                        <button class="btn btn-info btn-fancy w-100 btn-lg" onclick="viewAttemptDetails()" id="viewDetailsBtn">
                            <i class="bi bi-clipboard-data-fill me-2"></i>
                            <span data-en="View Quiz Attempt Details" data-ar="عرض تفاصيل محاولة الاختبار"></span>
                        </button>
                    </div>
                </div>

                <!-- Encouragement Message -->
                <div class="text-center mt-5">
                    <div class="encouragement-message">
                        <p class="mb-0" id="encouragementMessage">


                            <!-- Will be set by JavaScript -->
                        </p>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- Quiz Attempt Details Modal -->
    <div class="modal fade" id="quizDetailsModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
                    <h5 class="modal-title">
                        <i class="bi bi-journal-text me-2"></i>
                        <span data-en="Quiz Attempt Details" data-ar="تفاصيل محاولة الاختبار"></span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <!-- Quiz Summary -->
                    <div class="row mb-4">
                        <div class="col-md-12">
                            <div class="card border-0 bg-light">
                                <div class="card-body">
                                    <h6 class="fw-bold mb-3">
                                        <i class="bi bi-clipboard-data me-2"></i>
                                        <span data-en="Quiz Summary" data-ar="ملخص الاختبار"></span>
                                    </h6>
                                    <div class="row">
                                        <div class="col-md-3">
                                            <p class="mb-1"><strong data-en="Subject:" data-ar="المادة:"></strong> <span id="detailSubject" class="badge bg-info">-</span></p>
                                        </div>
                                        <div class="col-md-3">
                                            <p class="mb-1"><strong data-en="Score:" data-ar="الدرجة:"></strong> <span id="detailScore">-</span></p>
                                        </div>
                                        <div class="col-md-3">
                                            <p class="mb-1"><strong data-en="Time Taken:" data-ar="الوقت المستغرق:"></strong> <span id="detailTimeTaken">-</span></p>
                                        </div>
                                        <div class="col-md-3">
                                            <p class="mb-0"><strong data-en="Date:" data-ar="التاريخ:"></strong> <span id="detailDate">-</span></p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Questions and Answers -->
                    <h6 class="fw-bold mb-3">
                        <i class="bi bi-list-check me-2"></i>
                        <span data-en="Questions & Answers" data-ar="الأسئلة والإجابات"></span>
                    </h6>
                    <div id="detailQuestionsContainer">
                        <div class="text-center py-4">
                            <div class="spinner-border text-primary" role="status"></div>
                            <p class="mt-2 text-muted" data-en="Loading questions..." data-ar="جاري تحميل الأسئلة..."></p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" onclick="printQuizDetails()">
                        <i class="bi bi-printer me-2"></i>
                        <span data-en="Print" data-ar="طباعة"></span>
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <span data-en="Close" data-ar="إغلاق"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Confetti Animation for New Record -->
    <canvas id="confetti-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; display: none;"></canvas>

                <a href="contact.html" class="text-muted" data-en="Contact" data-ar="اتصل بنا">Contact</a>

                    © 2024 UAE Schools Competition. All rights reserved.
                </span>
            </p>
        </div>
    </footer>
