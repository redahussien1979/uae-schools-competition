<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">

                <span class="uae-ball ball-red"></span>

            <!-- Language Toggle Button -->

            </button>
        </div>

    <!-- Main Content -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <!-- Login Card -->
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">
                        
                        <!-- Icon -->
                        <div class="text-center mb-4">
                            <div class="login-icon">
                                <i class="bi bi-person-circle text-primary"></i>
                            </div>
                        </div>
                        
                        <!-- Title -->
                        <h2 class="text-center mb-4 fw-bold" data-en="Login" data-ar="تسجيل الدخول">Login</h2>
                        
                        <!-- Login Form -->
                        <form id="loginForm" onsubmit="handleLogin(event)">
                            
                            <!-- Username Field -->
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold" data-en="Username" data-ar="اسم المستخدم">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0">
                                        <i class="bi bi-person"></i>
                                    </span>
                                    <input type="text" 
                                           class="form-control border-start-0 ps-0" 
                                           id="username" 
                                           name="username"
                                           required 
                                           placeholder="">
                                </div>
                            </div>
                            
                            <!-- Password Field -->
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold" data-en="Password" data-ar="كلمة المرور">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0">
                                        <i class="bi bi-lock"></i>
                                    </span>
                                    <input type="password" 
                                           class="form-control border-start-0 ps-0" 
                                           id="password" 
                                           name="password"
                                           required 
                                           placeholder="">
                                    <button class="btn btn-outline-secondary border-start-0" 
                                            type="button" 
                                            onclick="togglePassword()">
                                        <i class="bi bi-eye" id="toggleIcon"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Login Button -->
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary btn-lg fw-semibold">
                                    <span data-en="Login" data-ar="دخول">Login</span>
                                    <i class="bi bi-arrow-right ms-2"></i>
                                </button>
                            </div>
                            
                        </form>
                        
                        <!-- Divider -->
                        <div class="text-center my-4">
                            <span class="text-muted" data-en="OR" data-ar="أو">OR</span>
                        </div>
                        
                        <!-- Register Link -->
                        <div class="text-center">
                            <p class="mb-0">
                                <span class="text-muted" data-en="New Student?" data-ar="طالب جديد؟">New Student?</span>
                            </p>
                            <a href="register.html" class="btn btn-outline-success fw-semibold mt-2">
                                <i class="bi bi-person-plus me-2"></i>
                                <span data-en="Register Now" data-ar="تسجيل جديد">Register Now</span>
